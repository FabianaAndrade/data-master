global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'fastapi-services'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'auth_service:8000'
          - 'ingestion_service:8001'
          - 'metadata_service:8002'
          - 'approval_service:8003'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://auth_service:8000/health
          - http://ingestion_service:8001/health
          - http://metadata_service:8002/health
          - http://approval_service:8003/health
          - http://datacontract_manager:8081
          - http://frontend:3000/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115