services:
  postgres_db:
    image: postgres:13
    container_name: postgres_db
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: data_catalog
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_db.session.sql:/docker-entrypoint-initdb.d/01-schema.sql:z
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d data_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ldap:
    build: ./ldap
    container_name: ldap
    hostname: ldap
    environment:
      LDAP_ORGANISATION: "empresa"
      LDAP_DOMAIN: "empresa.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    ports:
      - "389:389"
      - "636:636"
    privileged: true
    networks:
      - app-network

  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "8000:8000"
    depends_on:
      - ldap
    networks:
      - app-network

  ingestion_service:
    build: ./ingestion_service
    container_name: ingestion_service
    ports:
      - "8001:8001"
    depends_on:
      auth_service:
        condition: service_started
      postgres_db:
        condition: service_healthy
      metadata_service:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_db:5432/data_catalog
      - METADATA_SERVICE_URL=http://metadata_service:8002
    networks:
      - app-network

  metadata_service:
    build: ./metadata_service
    container_name: metadata_service
    ports:
      - "8002:8002"
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_db:5432/data_catalog
    networks:
      - app-network

  approval_service:
    build: ./approval_service
    container_name: approval_service
    ports:
      - "8003:8003"
    depends_on:
      - auth_service
      - metadata_service
    environment:
      - METADATA_SERVICE_URL=http://metadata_service:8002
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - auth_service
      - ingestion_service
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Kafka + CDC (Debezium)
  # ---------------------------------------------------------------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-connect:
    image: debezium/connect:2.5
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s

  register-connector:
    image: alpine:3.19
    container_name: register-connector
    depends_on:
      kafka-connect:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        echo '🚀 Registrando connector Debezium (ingestions)...'
        wget --quiet --output-document=- \
          --header='Content-Type: application/json' \
          --post-data='{"name":"ingestions-connector","config":{"connector.class":"io.debezium.connector.postgresql.PostgresConnector","database.hostname":"postgres_db","database.port":"5432","database.user":"user","database.password":"password","database.dbname":"data_catalog","topic.prefix":"dbserver1","table.include.list":"public.ingestions","plugin.name":"pgoutput","slot.name":"debezium_slot","publication.name":"dbz_publication","publication.autocreate.mode":"filtered","key.converter":"org.apache.kafka.connect.json.JsonConverter","key.converter.schemas.enable":"false","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","snapshot.mode":"initial"}}' \
          http://kafka-connect:8083/connectors 2>&1 || true
        echo ''
        sleep 3
        echo '🚀 Registrando connector Outbox (EventRouter)...'
        wget --quiet --output-document=- \
          --header='Content-Type: application/json' \
          --post-data='{"name":"outbox-connector","config":{"connector.class":"io.debezium.connector.postgresql.PostgresConnector","database.hostname":"postgres_db","database.port":"5432","database.user":"user","database.password":"password","database.dbname":"data_catalog","topic.prefix":"outbox","table.include.list":"public.outbox","plugin.name":"pgoutput","slot.name":"debezium_outbox_slot","publication.name":"dbz_outbox_publication","publication.autocreate.mode":"filtered","tombstones.on.delete":"false","key.converter":"org.apache.kafka.connect.json.JsonConverter","key.converter.schemas.enable":"false","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","transforms":"outbox","transforms.outbox.type":"io.debezium.transforms.outbox.EventRouter","transforms.outbox.table.field.event.id":"id","transforms.outbox.table.field.event.key":"aggregateid","transforms.outbox.table.field.event.payload":"payload","transforms.outbox.table.field.event.timestamp":"created_at","transforms.outbox.route.topic.replacement":"$${routedByValue}.events"}}' \
          http://kafka-connect:8083/connectors 2>&1 || true
        echo ''
        sleep 3
        echo '📋 Connectors registrados:'
        wget --quiet --output-document=- http://kafka-connect:8083/connectors 2>&1
        echo ''
    networks:
      - app-network
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: data-master
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    networks:
      - app-network

  cdc_consumer:
    build: ./cdc_consumer
    container_name: cdc_consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - CDC_TOPIC=ingestion.events
      - CONSUMER_GROUP_ID=cdc-approved-ingestions
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
